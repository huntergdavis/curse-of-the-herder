<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Curse of the Herder: a no-input browser screensaver. A cursed herder gathers his flock across a vast tile map over a 9-hour day, swearing ever more eloquently as he goes." />
    <title>Curse of the Herder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2b2620;
        --paper: #fffdf5;
        --paper-2: #f4ecd8;
        --accent: #c94f4f;
        --hud-font: "Fredoka", "Trebuchet MS", sans-serif;
        --hand-font: "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
      }
      html, body { margin: 0; height: 100%; background: #3d6fa3; overflow: hidden; font-family: var(--hud-font); color: var(--ink); }
      canvas#game { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
      .panel { position: fixed; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 rgba(43, 38, 32, 0.35); padding: 8px 12px; }
      #hud { top: 12px; left: 12px; min-width: 240px; display: flex; flex-direction: column; gap: 4px; }
      #hud .name { font-weight: 600; font-size: 18px; }
      #hud .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
      #hud .label { opacity: 0.7; }
      #meter { height: 10px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--paper-2); }
      #meter > div { height: 100%; width: 0%; background: linear-gradient(90deg, #f2c14e, #e8743a, #c94f4f); transition: width 0.6s; }
      #toolbar { top: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
      button, select { font: inherit; font-size: 14px; background: var(--paper-2); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
      button:hover { background: #fff3c4; }
      #minimap-wrap { right: 12px; bottom: 12px; padding: 6px; line-height: 0; }
      #minimap { width: 160px; height: 160px; border-radius: 6px; image-rendering: auto; }
      #line { left: 12px; bottom: 12px; max-width: 46vw; font-family: var(--hand-font); font-size: 16px; opacity: 0.9; }
      #line .label { font-family: var(--hud-font); font-size: 12px; opacity: 0.6; display: block; }
      #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(43, 38, 32, 0.55); color: var(--paper); font-size: 22px; text-align: center; padding: 24px; }
      #overlay[hidden] { display: none; }
      #overlay .card { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 16px; padding: 24px 32px; max-width: 520px; box-shadow: 4px 4px 0 rgba(0,0,0,0.3); }
      #overlay h1 { margin: 0 0 8px; font-size: 32px; }
      #overlay p { margin: 8px 0; font-size: 16px; }
      #overlay .epitaph { font-family: var(--hand-font); font-size: 22px; margin: 12px 0; }
      .badge { display: inline-block; background: var(--accent); color: var(--paper); border-radius: 6px; padding: 0 6px; font-size: 12px; margin-left: 6px; vertical-align: middle; }
      @media (max-width: 720px) { #line { display: none; } #minimap { width: 100px; height: 100px; } #hud { min-width: 0; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <section id="hud" class="panel" aria-label="Herder status">
      <div class="name" id="hud-name">Curse of the Herder</div>
      <div class="row"><span class="label">Day</span><span id="hud-clock">09:00</span></div>
      <div class="row"><span class="label">Flock</span><span id="hud-flock">0 / 0</span></div>
      <div class="row"><span class="label">Level</span><span id="hud-level">0 · Grunting</span></div>
      <div class="row"><span class="label">Books</span><span id="hud-books">0</span></div>
      <div class="row"><span class="label">Frustration</span><span id="hud-frust">0</span></div>
      <div id="meter"><div id="meter-fill"></div></div>
    </section>
    <nav id="toolbar" class="panel" aria-label="Controls">
      <button id="btn-pause" title="Pause (space)">Pause</button>
      <button id="btn-new" title="Start a new herder (N)">New herder</button>
      <select id="sel-load" title="Load a herder in progress"><option value="">Load…</option></select>
      <span id="hud-mode"></span>
    </nav>
    <div id="minimap-wrap" class="panel"><canvas id="minimap" width="160" height="160"></canvas></div>
    <div id="line" class="panel" aria-live="polite"><span class="label">Last heard</span><span id="line-text">…</span></div>
    <div id="overlay"><div class="card" id="overlay-card"><h1>Curse of the Herder</h1><p>Waking the herder and laying out the pasture…</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
